<title>Big Board 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a broadcast-style board. Control strip on top, map as the stage, race card docked right (below on phones). */
:root {
  --bg: #fbfaf7;
  --surface: #ffffff;
  --ink: #16181d;
  --ink-2: #4a4e57;
  --muted: #6b6f78;
  --line: #dddbd4;
  --off: #edece7;
  --nodata: #c4c2bb;
  --dem-1: #78acec; --dem-2: #4b8fe2; --dem-3: #256abf; --dem-4: #0d366b;
  --rep-1: #ee8c80; --rep-2: #e0645a; --rep-3: #c23b31; --rep-4: #7e1d17;
  --oth: #8a5cc8;
  --dem-ink: #1f5fae; --rep-ink: #b0362d;
  --select: #16181d;
  --warn-bg: #fff3d6; --warn-ink: #6b4a00;
  --test-bg: #2b1d4a; --test-ink: #f3ecff;
  --font-display: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1c1f24; --ink: #eceae4; --ink-2: #c3c1ba; --muted: #9a9ca3; --line: #30333a;
    --off: #2a2e35; --nodata: #50545d;
    --dem-1: #1c5cab; --dem-2: #3987e5; --dem-3: #6da7ec; --dem-4: #b7d3f6;
    --rep-1: #a0302a; --rep-2: #d24a40; --rep-3: #ec857b; --rep-4: #f7c3bc;
    --oth: #a985e0; --dem-ink: #8dbcf2; --rep-ink: #f19a90; --select: #ffffff;
    --warn-bg: #3a2e10; --warn-ink: #f6d58a; --test-bg: #d9c8ff; --test-ink: #1f1238;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1c1f24; --ink: #eceae4; --ink-2: #c3c1ba; --muted: #9a9ca3; --line: #30333a;
  --off: #2a2e35; --nodata: #50545d;
  --dem-1: #1c5cab; --dem-2: #3987e5; --dem-3: #6da7ec; --dem-4: #b7d3f6;
  --rep-1: #a0302a; --rep-2: #d24a40; --rep-3: #ec857b; --rep-4: #f7c3bc;
  --oth: #a985e0; --dem-ink: #8dbcf2; --rep-ink: #f19a90; --select: #ffffff;
  --warn-bg: #3a2e10; --warn-ink: #f6d58a; --test-bg: #d9c8ff; --test-ink: #1f1238;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.test-banner { background: var(--test-bg); color: var(--test-ink); font-family: var(--font-display); font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 6px 12px; border-radius: var(--radius); margin-bottom: 10px; }
.stale { background: var(--warn-bg); color: var(--warn-ink); padding: 6px 12px; border-radius: var(--radius); margin-bottom: 10px; font-weight: 600; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 20px; margin-bottom: 10px; }
.brand { display: flex; flex-direction: column; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.fresh { margin-left: auto; color: var(--ink-2); font-size: 12px; text-align: right; }
.fresh b { color: var(--ink); font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.office button { font-family: var(--font-display); font-size: 16px; letter-spacing: .02em; padding: 6px 14px; }
.search { position: relative; flex: 1 1 200px; max-width: 320px; }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.tally { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 10px; align-items: baseline; }
.tally .office-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin-right: 6px; }
.tally .d { color: var(--dem-ink); font-weight: 700; }
.tally .r { color: var(--rep-ink); font-weight: 700; }
.tally .o { color: var(--oth); font-weight: 700; }
.tally .n { font-family: var(--font-display); font-size: 22px; line-height: 1; }
.tally .rest { color: var(--muted); font-size: 12px; margin-left: 4px; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 860px) { .board { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.stage.waiting #viewport, .stage.waiting .legend { visibility: hidden; }
.stage svg { display: block; width: 100%; height: auto; touch-action: none; }
.map-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.map-tools button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 4px 9px; cursor: pointer; font-weight: 600; }
.shape { stroke: var(--surface); stroke-width: .5; cursor: pointer; vector-effect: non-scaling-stroke; }
.shape.off { fill: var(--off); stroke: var(--line); cursor: default; }
.shape.prior { stroke: var(--ink-2); stroke-dasharray: 2 2; stroke-width: .6; }
.shape.selected { stroke: var(--select); stroke-width: 2.4; stroke-dasharray: none; }
.state-line { fill: none; stroke: var(--ink-2); stroke-width: .7; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .75; }
.label { font-family: var(--font-display); font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.legend .scale { display: inline-flex; align-items: center; gap: 2px; }
.legend .sw { width: 18px; height: 12px; border-radius: 2px; display: inline-block; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .tick { font-variant-numeric: tabular-nums; color: var(--muted); }

aside.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; margin: 2px 0 8px; text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-weight: 700; font-size: 12px; border: 1px solid currentColor; }
.pill.D { color: var(--dem-ink); } .pill.R { color: var(--rep-ink); } .pill.O { color: var(--oth); } .pill.N { color: var(--muted); }
.pill.solid.D { background: var(--dem-3); border-color: var(--dem-3); color: #fff; }
.pill.solid.R { background: var(--rep-3); border-color: var(--rep-3); color: #fff; }
.pill.solid.O { background: var(--oth); border-color: var(--oth); color: #fff; }
.cands { width: 100%; border-collapse: collapse; margin: 12px 0 6px; }
.cands td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.cands td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
.cands .nm { font-weight: 600; }
.cands .meta { color: var(--muted); font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--off); margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.win-mark { font-weight: 700; color: var(--ink); margin-left: 4px; }
.reporting { color: var(--ink-2); font-size: 12px; margin-bottom: 10px; }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; margin: 10px 0 0; font-size: 13px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
dl.facts .est { color: var(--muted); font-size: 12px; }
.note { color: var(--ink-2); font-size: 12px; margin-top: 10px; border-left: 3px solid var(--line); padding-left: 8px; }
.card .actions { display: flex; gap: 8px; margin-top: 12px; }
.card .actions button { border: 1px solid var(--line); background: transparent; border-radius: var(--radius); padding: 5px 10px; cursor: pointer; font-weight: 600; }
.empty { color: var(--ink-2); }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 5px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -120%); }
footer.fine { color: var(--muted); font-size: 11px; margin-top: 14px; }
@media (max-width: 480px) { .map-tools { top: 4px; right: 4px; } .map-tools button { padding: 2px 6px; font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="test-banner" class="test-banner" hidden>Test data — simulated results, not real votes</div>
<div id="stale" class="stale" role="status" hidden></div>
<header class="top">
  <div class="brand">
    <h1>Big Board 2026</h1>
    <span class="sub">General election · November 3, 2026</span>
  </div>
  <div class="fresh" id="fresh" aria-live="polite">Loading results…</div>
</header>
<div class="controls">
  <div class="seg office" role="group" aria-label="Office">
    <button type="button" data-office="Governor" aria-pressed="false">Governor</button>
    <button type="button" data-office="Senate" aria-pressed="false">Senate</button>
    <button type="button" data-office="House" aria-pressed="true">House</button>
  </div>
  <div class="seg metric" role="group" aria-label="Color the map by">
    <button type="button" data-metric="results" aria-pressed="true">Results</button>
    <button type="button" data-metric="polls" aria-pressed="false">Polls</button>
    <button type="button" data-metric="pres" aria-pressed="false">President</button>
    <button type="button" data-metric="pvi" aria-pressed="false">PVI</button>
    <button type="button" data-metric="incumbent" aria-pressed="false">Incumbent</button>
  </div>
  <div class="search">
    <label for="search" hidden>Find a race</label>
    <input id="search" type="search" list="race-list" placeholder="Find a race, state, or candidate" autocomplete="off">
    <datalist id="race-list"></datalist>
  </div>
</div>
<div class="tally" id="tally"></div>
<main class="board">
  <section class="stage waiting" id="stage" aria-label="Map">
    <svg id="map" viewBox="0 0 960 600" role="img" aria-label="Map of races">
      <defs id="patterns"></defs>
      <g id="viewport"><g id="shapes"></g><g id="lines"></g><g id="labels"></g></g>
    </svg>
    <div class="map-tools"><button type="button" id="reset">Reset zoom</button></div>
    <div class="tooltip" id="tip" hidden></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="card" id="card" aria-live="polite"></aside>
</main>
<footer class="fine" id="fine">Results: Associated Press via the Boston Globe elections API. Context: project baseline of 2026 races (incumbents, 2024 presidential margins, Cook PVI, polling averages). <span id="loaded"></span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("board-data").textContent);
  const GEO = DATA.geometry;
  const NAMES = DATA.state_names;
  const RESULTS_URL = "data/results.json";
  const LIVE_COLLECTION = "live";
  const POLL_MS = 60000;
  const DB_WAIT_MS = 10000;
  const LOADED_AT = new Date().toISOString();
  const STALE_MINUTES = 15;
  const STORE_KEY = "bigboard-view-v1";
  const OFFICE_SUFFIX = { Senate: "SEN", Governor: "GOV" };
  const BINS = [5, 10, 20];
  const PVI_BINS = [2.5, 5, 10];

  const races = {};
  for (const row of DATA.races) {
    const r = {};
    DATA.race_columns.forEach((c, i) => { r[c] = row[i]; });
    races[r.race_key] = r;
  }

  let results = null;
  let view = { office: "House", metric: "results", selected: null, transform: null };
  try { Object.assign(view, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
  function saveView() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(view)); } catch (e) {}
  }

  // ---- helpers ------------------------------------------------------------------------------------
  const num = (s) => (s === "" || s === null || s === undefined ? null : Number(s));
  const bin = (m, bins = BINS) => { const a = Math.abs(m); return a < bins[0] ? 1 : a < bins[1] ? 2 : a < bins[2] ? 3 : 4; };
  const partyColor = (group, m) => group === "DEM" ? `var(--dem-${bin(m)})` : group === "REP" ? `var(--rep-${bin(m)})` : "var(--oth)";
  // A 2024 margin is shown when it describes the current lines: from the source, or estimated on them.
  const hasPres = (base) => base.pres_2024_status === "available" || base.pres_2024_status === "interpolated";
  const marginColor = (m, bins = BINS) => (m === null || Number.isNaN(m) ? "var(--nodata)" : m >= 0 ? `var(--dem-${bin(m, bins)})` : `var(--rep-${bin(m, bins)})`);
  const signed = (m, dLabel = "D", rLabel = "R") => m === null ? "—" : (m >= 0 ? `${dLabel}+${Math.abs(m).toFixed(1)}` : `${rLabel}+${Math.abs(m).toFixed(1)}`);
  const fmtInt = d3.format(",");
  const etTime = (iso) => iso ? new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET" : "—";
  const partyLetter = (g) => g === "DEM" ? "D" : g === "REP" ? "R" : "O";
  const baseParty = (p) => p === "DEM" ? "D" : p === "REP" ? "R" : "O";
  const raceKeyFor = (office, state) => `${state}-${OFFICE_SUFFIX[office]}`;
  const officeLabel = (r) => r.office === "House" ? (r.race_key.endsWith("-AL") ? "At-large district" : `District ${Number(r.district)}`) : r.office;
  const raceTitle = (r) => r.office === "House" ? r.race_key : `${NAMES[r.state_postal]} ${r.office}`;

  // ---- patterns for uncalled leads ------------------------------------------------------------------
  const defs = d3.select("#patterns");
  for (const party of ["dem", "rep"]) {
    for (let i = 1; i <= 4; i++) {
      const p = defs.append("pattern").attr("id", `lead-${party}-${i}`).attr("patternUnits", "userSpaceOnUse")
        .attr("width", 4).attr("height", 4).attr("patternTransform", "rotate(45)");
      p.append("rect").attr("width", 4).attr("height", 4).attr("fill", "var(--off)");
      p.append("rect").attr("width", 2.2).attr("height", 4).attr("fill", `var(--${party}-${i})`);
    }
  }
  const oth = defs.append("pattern").attr("id", "lead-oth").attr("patternUnits", "userSpaceOnUse")
    .attr("width", 4).attr("height", 4).attr("patternTransform", "rotate(45)");
  oth.append("rect").attr("width", 4).attr("height", 4).attr("fill", "var(--off)");
  oth.append("rect").attr("width", 2.2).attr("height", 4).attr("fill", "var(--oth)");
  const leadFill = (group, m) => group === "DEM" ? `url(#lead-dem-${bin(m)})` : group === "REP" ? `url(#lead-rep-${bin(m)})` : "url(#lead-oth)";

  // ---- metric → fill --------------------------------------------------------------------------------
  function fillFor(key) {
    const base = races[key];
    if (!base) return "var(--off)";
    if (view.metric === "incumbent") {
      if (base.roster_vacant === "True" || !base.roster_incumbent_party) return "var(--nodata)";
      const p = base.roster_incumbent_party;
      return p === "D" ? "var(--dem-3)" : p === "R" ? "var(--rep-3)" : "var(--oth)";
    }
    if (view.metric === "pres") return hasPres(base) ? marginColor(num(base.pres_2024_dem_margin_pp)) : "var(--nodata)";
    if (view.metric === "pvi") return base.cook_pvi_status === "available" ? marginColor(num(base.cook_pvi_dem_lean_pp), PVI_BINS) : "var(--nodata)";
    if (view.metric === "polls") return base.poll_avg_status === "available" ? marginColor(num(base.poll_avg_dem_margin_pp)) : "var(--nodata)";
    const r = results?.races?.[key];
    if (!r || !r.total_votes) {
      if (r?.called && r.winner) return partyColor(r.winner.party_group, 25);
      return "var(--nodata)";
    }
    if (r.called && r.winner) {
      const m = r.winner.party_group === r.leader_party_group ? r.leader_margin_pp : 1;
      return partyColor(r.winner.party_group, m);
    }
    return leadFill(r.leader_party_group, r.leader_margin_pp);
  }

  // ---- map ------------------------------------------------------------------------------------------
  const svg = d3.select("#map");
  const viewport = d3.select("#viewport");
  const tip = document.getElementById("tip");
  let currentK = 1;
  const zoom = d3.zoom().scaleExtent([1, 24]).translateExtent([[0, 0], [960, 600]])
    .on("zoom", (event) => {
      viewport.attr("transform", event.transform);
      currentK = event.transform.k;
      defs.selectAll("pattern").attr("patternTransform", `rotate(45) scale(${1 / currentK})`);
      view.transform = { x: event.transform.x, y: event.transform.y, k: event.transform.k };
      drawLabels();
    })
    .on("end", saveView);
  svg.call(zoom).on("dblclick.zoom", null);

  function shapesForOffice() {
    if (view.office === "House") {
      return Object.entries(GEO.districts).map(([key, d]) => ({ id: key, key, path: d.path, prior: d.vintage === "prior_boundaries" }));
    }
    const list = Object.entries(GEO.states).map(([st, s]) => {
      const key = raceKeyFor(view.office, st);
      return { id: st, key: races[key] ? key : null, path: s.path, prior: false };
    });
    return list;
  }

  function drawMap() {
    const data = shapesForOffice();
    const sel = d3.select("#shapes").selectAll("path").data(data, (d) => d.id);
    sel.exit().remove();
    const all = sel.enter().append("path").attr("class", "shape").merge(sel)
      .attr("d", (d) => d.path)
      .attr("fill", (d) => d.key ? fillFor(d.key) : "var(--off)")
      .classed("off", (d) => !d.key)
      .classed("prior", (d) => d.prior)
      .classed("selected", (d) => d.key && d.key === view.selected)
      .attr("aria-label", (d) => d.key ? raceTitle(races[d.key]) : `${NAMES[d.id] || d.id}: no race`)
      .on("click", (event, d) => { if (d.key) select(d.key); })
      .on("mousemove", (event, d) => showTip(event, d))
      .on("mouseleave", () => { tip.hidden = true; });
    all.filter(".selected").raise();
    const lines = view.office === "House" ? Object.entries(GEO.states) : [];
    const ls = d3.select("#lines").selectAll("path").data(lines, (d) => d[0]);
    ls.exit().remove();
    ls.enter().append("path").attr("class", "state-line").merge(ls).attr("d", (d) => d[1].path);
    const dc = d3.select("#shapes").selectAll("path.dc").data(Object.values(GEO.no_race));
    dc.enter().append("path").attr("class", "shape off dc").merge(dc).attr("d", (d) => d.path);
    drawLabels();
  }

  function drawLabels() {
    const show = view.office === "House" && currentK >= 4;
    const items = show ? Object.entries(GEO.districts) : [];
    const sel = d3.select("#labels").selectAll("text").data(items, (d) => d[0]);
    sel.exit().remove();
    sel.enter().append("text").attr("class", "label").merge(sel)
      .attr("x", (d) => d[1].center[0]).attr("y", (d) => d[1].center[1])
      .attr("font-size", 11 / currentK).attr("stroke-width", 2.5 / currentK)
      .text((d) => d[0].endsWith("-AL") ? "AL" : String(Number(d[0].slice(-2))));
  }

  function showTip(event, d) {
    if (!d.key) { tip.hidden = true; return; }
    const r = results?.races?.[d.key];
    const lead = r && r.total_votes ? `${r.called ? "Won" : "Leads"}: ${(r.called ? r.winner.name : r.candidates[0].name)}` : "No results yet";
    tip.textContent = `${raceTitle(races[d.key])} · ${lead}`;
    const box = document.getElementById("stage").getBoundingClientRect();
    tip.style.left = `${event.clientX - box.left}px`;
    tip.style.top = `${event.clientY - box.top}px`;
    tip.hidden = false;
  }

  function zoomToState(state) {
    const b = GEO.states[state]?.bbox;
    if (!b) return;
    const [x0, y0, x1, y1] = b;
    const k = Math.min(24, 0.85 / Math.max((x1 - x0) / 960, (y1 - y0) / 600));
    const t = d3.zoomIdentity.translate(480, 300).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 600).call(zoom.transform, t);
  }
  document.getElementById("reset").addEventListener("click", () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));

  // ---- legend ---------------------------------------------------------------------------------------
  function legend() {
    const el = document.getElementById("legend");
    const scale = (prefix) => [1, 2, 3, 4].map((i) => `<span class="sw" style="background:var(--${prefix}-${i})"></span>`).join("");
    const ticks = view.metric === "pvi" ? `<span class="tick">&lt;2.5 · 2.5–5 · 5–10 · 10+ pts</span>` : `<span class="tick">&lt;5 · 5–10 · 10–20 · 20+ pts</span>`;
    const off = `<span class="item"><span class="sw" style="background:var(--off);outline:1px solid var(--line)"></span>No race</span>`;
    const nodata = (label) => `<span class="item"><span class="sw" style="background:var(--nodata)"></span>${label}</span>`;
    const prior = view.office === "House" ? `<span class="item"><span class="sw" style="background:var(--off);outline:1px dashed var(--ink-2)"></span>Drawn on 2024 lines</span>` : "";
    let html = "";
    if (view.metric === "incumbent") {
      html = `<span class="item"><span class="sw" style="background:var(--dem-3)"></span>Democrat</span><span class="item"><span class="sw" style="background:var(--rep-3)"></span>Republican</span><span class="item"><span class="sw" style="background:var(--oth)"></span>Independent</span>${nodata("Vacant")}`;
    } else {
      const label = { results: "Winner's margin", polls: "Polling average margin", pres: "Harris–Trump margin, 2024", pvi: "Cook PVI lean" }[view.metric];
      html = `<span class="item">${label}</span><span class="scale">${scale("rep").split("</span>").reverse().join("</span>")}</span><span class="scale">${scale("dem")}</span>${ticks}`;
      if (view.metric === "results") {
        html += `<span class="item"><svg width="18" height="12" aria-hidden="true"><rect width="18" height="12" fill="url(#lead-dem-3)"/></svg><svg width="18" height="12" aria-hidden="true"><rect width="18" height="12" fill="url(#lead-rep-3)"/></svg>Leading, not called</span>`
          + `<span class="item"><span class="sw" style="background:var(--oth)"></span>Other party</span>${nodata("No votes yet")}`;
      } else {
        html += nodata(view.metric === "polls" ? "No polling average" : view.metric === "pres" ? "Not on 2026 lines" : "Not available");
      }
    }
    el.innerHTML = html + off + prior;
  }

  // ---- tally and freshness --------------------------------------------------------------------------
  function tally() {
    const el = document.getElementById("tally");
    if (!results) { el.innerHTML = ""; return; }
    el.innerHTML = ["Senate", "Governor", "House"].map((o) => {
      const s = results.summary[o];
      const rest = s.races - s.called.DEM - s.called.REP - s.called.OTHER;
      return `<span><span class="office-name">${o}</span><span class="n d num">${s.called.DEM}</span> <span class="n r num">${s.called.REP}</span>${s.called.OTHER ? ` <span class="n o num">${s.called.OTHER}</span>` : ""}<span class="rest">${rest} of ${s.races} uncalled</span></span>`;
    }).join("");
    const pv = results.national?.house_popular_vote;
    if (pv && pv.DEM?.pct !== null && pv.DEM?.pct !== undefined) {
      el.innerHTML += `<span><span class="office-name">House vote</span><span class="d num">D ${pv.DEM.pct.toFixed(1)}%</span> · <span class="r num">R ${pv.REP.pct.toFixed(1)}%</span></span>`;
    }
  }

  function freshness() {
    const el = document.getElementById("fresh");
    const stale = document.getElementById("stale");
    document.getElementById("test-banner").hidden = !results?.test;
    if (!results) { el.textContent = "No results published yet"; stale.hidden = true; return; }
    el.innerHTML = `AP update <b class="num">${etTime(results.ap_last_updated)}</b> · Published <b class="num">${etTime(results.fetched_at)}</b>`;
    const ageMin = (Date.now() - Date.parse(results.fetched_at)) / 60000;
    const now = Date.now();
    const night = now >= Date.parse("2026-11-03T22:00:00Z") && now <= Date.parse("2026-11-04T12:00:00Z");
    stale.hidden = !(night && ageMin > STALE_MINUTES);
    if (!stale.hidden) stale.textContent = `Results last published ${Math.round(ageMin)} minutes ago, at ${etTime(results.fetched_at)}. Newer results may be available.`;
  }

  // ---- race card ------------------------------------------------------------------------------------
  function statusPill(base, r) {
    if (r?.called && r.winner) {
      const l = partyLetter(r.winner.party_group);
      return `<span class="pill solid ${l}">Called · ${l}</span>`;
    }
    if (r?.total_votes) {
      const l = partyLetter(r.leader_party_group);
      return `<span class="pill ${l}">${l} leads by ${r.leader_margin_pp.toFixed(1)}</span>`;
    }
    if (r?.poll_close && Date.parse(r.poll_close) > Date.parse(results.ap_last_updated || 0)) {
      return `<span class="pill N">Polls close ${etTime(r.poll_close)}</span>`;
    }
    return `<span class="pill N">No votes reported</span>`;
  }

  function candidateRows(base, r) {
    if (r && r.candidates.length) {
      const top = Math.max(...r.candidates.map((c) => c.pct || 0), 1);
      return r.candidates.map((c) => {
        const color = c.party_group === "DEM" ? "var(--dem-3)" : c.party_group === "REP" ? "var(--rep-3)" : "var(--oth)";
        const w = c.pct === null ? 0 : (100 * c.pct) / top;
        return `<tr><td><span class="nm">${esc(c.name)}</span>${c.winner ? '<span class="win-mark" aria-label="winner">✓ Winner</span>' : ""}<div class="meta">${esc(c.party)}${c.incumbent ? " · Incumbent" : ""}</div><div class="bar"><i style="width:${w}%;background:${color}"></i></div></td>`
          + `<td class="v"><b>${c.pct === null ? "—" : c.pct.toFixed(1) + "%"}</b><div class="meta">${fmtInt(c.votes)}</div></td></tr>`;
      }).join("");
    }
    return (DATA.candidates[base.race_key] || []).map(([name, party, inc]) =>
      `<tr><td><span class="nm">${esc(name)}</span><div class="meta">${party}${inc ? " · Incumbent" : ""}</div></td><td class="v">—</td></tr>`).join("");
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function card() {
    const el = document.getElementById("card");
    const base = races[view.selected];
    if (!base) {
      el.innerHTML = `<div class="eyebrow">Race detail</div><h2>Select a race</h2><p class="empty">Click a ${view.office === "House" ? "district" : "state"} on the map or search by race (PA-07, GA-SEN), state, or candidate.</p>`;
      return;
    }
    const r = results?.races?.[base.race_key];
    const pres = !hasPres(base) ? "Describes 2024 lines"
      : signed(num(base.pres_2024_dem_margin_pp), "Harris ", "Trump ")
        + (base.pres_2024_status === "interpolated" ? ' <span class="est">(est. on 2026 lines)</span>' : "");
    const poll = base.poll_avg_status === "available"
      ? `${esc(base.poll_avg_dem_candidate)} ${num(base.poll_avg_dem_pct).toFixed(1)}%, ${esc(base.poll_avg_rep_candidate)} ${num(base.poll_avg_rep_pct).toFixed(1)}% <span class="meta">(${base.poll_count} polls)</span>`
      : "No polling average";
    const inc = base.roster_vacant === "True" ? "Vacant" : `${esc(base.roster_incumbent_name)} (${base.roster_incumbent_party})${base.open_seat === "True" ? " · not running" : ""}`;
    const geo = GEO.districts[base.race_key];
    const reporting = r && (r.total_votes || r.called)
      ? `<div class="reporting num">${r.eevp ?? 0}% of expected vote · ${r.precincts_pct ?? 0}% of precincts · ${fmtInt(r.total_votes)} votes</div>` : "";
    const notes = [];
    if (geo && geo.vintage === "prior_boundaries") notes.push(`This shape shows the district's 2024 lines. ${NAMES[base.state_postal]} voted on a new map in 2026.`);
    if (base.pres_2024_status === "interpolated") notes.push("The 2024 margin is estimated by reallocating 2024 results from the old districts to the 2026 lines, weighted by population and county vote rates. Where it differs from Cook PVI, PVI is the better guide.");
    if (r?.race_type && r.race_type !== "General") notes.push(`AP race type: ${esc(r.race_type)}.`);
    if (r?.ranked_choice) notes.push("Ranked-choice race: a winner needs a majority after tabulation.");
    if (base.guide_notes) notes.push(esc(base.guide_notes));
    el.innerHTML = `<div class="eyebrow">${esc(NAMES[base.state_postal])} · ${officeLabel(base)}</div>`
      + `<h2>${esc(raceTitle(base))}</h2>${statusPill(base, r)}`
      + `<table class="cands"><tbody>${candidateRows(base, r)}</tbody></table>${reporting}`
      + `<dl class="facts"><dt>Incumbent</dt><dd>${inc}</dd>${base.open_seat === "True" ? "<dt>Seat</dt><dd>Open</dd>" : ""}`
      + `<dt>President 2024</dt><dd>${pres}</dd><dt>Cook PVI</dt><dd>${esc(base.cook_pvi_label || "—")}</dd>`
      + `<dt>Polls</dt><dd>${poll}</dd>${base.guide_rating ? `<dt>Rating</dt><dd>${esc(base.guide_rating)}</dd>` : ""}</dl>`
      + notes.map((n) => `<p class="note">${n}</p>`).join("")
      + `<div class="actions"><button type="button" id="zoom-state">Zoom to ${esc(NAMES[base.state_postal])}</button></div>`;
    document.getElementById("zoom-state").addEventListener("click", () => zoomToState(base.state_postal));
  }

  // ---- selection, search, controls ----------------------------------------------------------------
  function select(key, zoomIn = false) {
    const base = races[key];
    if (!base) return;
    view.selected = key;
    if (base.office !== view.office) { view.office = base.office; render(); } else { drawMap(); card(); }
    if (zoomIn) zoomToState(base.state_postal);
    saveView();
  }

  const searchIndex = [];
  for (const r of Object.values(races)) {
    const label = `${r.race_key} · ${NAMES[r.state_postal]} ${r.office}${r.office === "House" ? " " + Number(r.district || 0) : ""}`;
    searchIndex.push({ label, key: r.race_key });
    for (const [name] of DATA.candidates[r.race_key] || []) searchIndex.push({ label: `${name} · ${r.race_key}`, key: r.race_key });
  }
  document.getElementById("race-list").innerHTML = searchIndex.map((s) => `<option value="${esc(s.label)}"></option>`).join("");
  const searchEl = document.getElementById("search");
  function runSearch() {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) return;
    const exact = searchIndex.find((s) => s.label.toLowerCase() === q || s.key.toLowerCase() === q);
    const hit = exact || searchIndex.find((s) => s.label.toLowerCase().includes(q));
    if (hit) { select(hit.key, true); return; }
    const state = Object.entries(NAMES).find(([st, n]) => st.toLowerCase() === q || n.toLowerCase() === q);
    if (state) {
      const key = view.office === "House" ? Object.keys(races).find((k) => races[k].state_postal === state[0] && races[k].office === "House") : raceKeyFor(view.office, state[0]);
      if (races[key]) select(key, true); else zoomToState(state[0]);
    }
  }
  searchEl.addEventListener("change", runSearch);
  searchEl.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

  document.querySelectorAll("[data-office]").forEach((b) => b.addEventListener("click", () => {
    view.office = b.dataset.office;
    if (view.selected && races[view.selected]?.office !== view.office) {
      const st = races[view.selected].state_postal;
      const key = view.office === "House" ? null : raceKeyFor(view.office, st);
      view.selected = key && races[key] ? key : null;
    }
    saveView(); render();
  }));
  document.querySelectorAll("[data-metric]").forEach((b) => b.addEventListener("click", () => {
    view.metric = b.dataset.metric; saveView(); render();
  }));

  function render() {
    document.querySelectorAll("[data-office]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.office === view.office)));
    document.querySelectorAll("[data-metric]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.metric === view.metric)));
    drawMap(); legend(); tally(); freshness(); card();
  }

  // ---- results delivery -------------------------------------------------------------------------
  // Live results arrive as database records in the "live" collection, written by the update loop; a write makes
  // no new artifact version, so the board updates in place. The published data/results.json is the fallback.
  let source = null;
  let pollTimer = null;

  function accept(next, from) {
    if (results && Date.parse(next.fetched_at) < Date.parse(results.fetched_at)) return;
    const same = results && next.content_hash === results.content_hash && next.fetched_at === results.fetched_at;
    results = next;
    source = from;
    document.getElementById("stage").classList.remove("waiting");
    document.getElementById("loaded").textContent = `Board loaded ${etTime(LOADED_AT)} · results from ${from === "db" ? "live database" : "published file"}.`;
    if (same) freshness(); else render();
  }

  function assemble(snap) {
    const docs = {};
    snap.docs.forEach((d) => { if (d.exists) docs[d.id] = d.data(); });
    const meta = docs.meta;
    if (!meta || !Array.isArray(meta.records)) return null;
    const races = {};
    for (const name of meta.records) {
      const part = docs[name];
      if (!part || part.content_hash !== meta.content_hash) return null;
      Object.assign(races, part.races);
    }
    const { records, ...rest } = meta;
    return { ...rest, races };
  }

  async function loadFile() {
    try {
      const response = await fetch(`${RESULTS_URL}?ts=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      accept(await response.json(), "file");
    } catch (error) {
      if (!results) document.getElementById("fresh").textContent = "No results published yet";
      freshness();
    }
    document.getElementById("stage").classList.remove("waiting");
  }

  function startFallback() {
    if (pollTimer || source === "db") return;
    loadFile();
    pollTimer = setInterval(loadFile, POLL_MS);
  }

  function stopFallback() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  async function startDatabase() {
    const db = await window.claude?.use?.("db");
    if (!db) { startFallback(); return; }
    const timer = setTimeout(startFallback, DB_WAIT_MS);
    db.collection(LIVE_COLLECTION).onSnapshot((snap) => {
      const next = assemble(snap);
      if (!next) return;
      if (!snap.metadata?.fromCache) { clearTimeout(timer); stopFallback(); }
      accept(next, "db");
    }, (error) => {
      console.warn("live results subscription ended", error);
      clearTimeout(timer);
      source = null;
      startFallback();
    });
  }

  if (view.transform) svg.call(zoom.transform, d3.zoomIdentity.translate(view.transform.x, view.transform.y).scale(view.transform.k));
  render();
  startDatabase();
  setInterval(freshness, POLL_MS);
})();
</script>
